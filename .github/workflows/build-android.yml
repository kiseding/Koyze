name: Build Android release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos

      - name: Run deterministic Flutter tests
        env:
          NO_PROXY: 'localhost,127.0.0.1,::1'
          no_proxy: 'localhost,127.0.0.1,::1'
        run: flutter test --exclude-tags live

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore android/app/release.jks \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Android release APKs and app bundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Validate APKs
        run: |
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Verify Android release signatures and alignment
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          done
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Android-APKs
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android assets to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
