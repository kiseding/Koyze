name: Build Android release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require source commit on main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main

  build-android:
    needs: verify-release-source
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prefer GCS Maven Central for Gradle
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cp android/init.gradle "$HOME/.gradle/init.d/gcs-maven-central.gradle"

      - name: Set up Flutter
        # Reviewed upstream major: uses: subosito/flutter-action@v2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Require Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run deterministic Flutter tests
        run: flutter test --exclude-tags live

      - name: Create Android release signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore android/app/release.jks \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Android release APKs and app bundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Rename APKs with app name and version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/android-release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="build/android-release/Koyze-${version}-${abi}.apk"
            cp "$src" "$dst"
          done
          cp build/app/outputs/bundle/release/app-release.aab \
            "build/android-release/Koyze-${version}.aab"

      - name: Validate APKs
        run: |
          for apk in build/android-release/*.apk; do
            test -s "$apk"
          done
          for aab in build/android-release/*.aab; do
            test -s "$aab"
          done

      - name: Verify Android release signatures and alignment
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/android-release/*.apk; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          done
          jarsigner -verify -certs build/android-release/*.aab

      - name: Remove Android signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Upload Android APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Android-APKs
          path: build/android-release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Android-AAB
          path: build/android-release/*.aab
          if-no-files-found: error
          retention-days: 7

  release-android:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Koyze-Android-APKs
          path: release-assets

      - name: Download Android app bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Koyze-Android-AAB
          path: release-assets

      - name: Generate Android checksums
        working-directory: release-assets
        run: sha256sum -- *.apk *.aab > Koyze-Android-SHA256SUMS

      - name: Upload Android assets to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
