name: Build Android release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ref_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml does not declare a version"
            exit 1
          fi
          IFS=. read -r ref_major ref_minor _ <<< "$ref_version"
          IFS=. read -r pubspec_major pubspec_minor _ <<< "${pubspec_version%%+*}"
          if [ "$ref_major.$ref_minor" != "$pubspec_major.$pubspec_minor" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version; bump pubspec.yaml before tagging"
            exit 1
          fi

      - name: Require Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prefer GCS Maven Central for Gradle
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cp android/init.gradle "$HOME/.gradle/init.d/gcs-maven-central.gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos

      - name: Run deterministic Flutter tests
        run: flutter test --exclude-tags live

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore android/app/release.jks \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Android release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with app name and version
        run: |
          set -euo pipefail
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml does not declare a version"
            exit 1
          fi
          version="${pubspec_version%%+*}"
          mkdir -p build/android-release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="build/android-release/Koyze-${version}-${abi}.apk"
            cp "$src" "$dst"
          done

      - name: Validate APKs
        run: |
          for apk in build/android-release/*.apk; do
            test -s "$apk"
          done

      - name: Verify Android release signatures and alignment
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/android-release/*.apk; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          done

      - name: Upload Android APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Android-APKs-${{ github.sha }}
          path: build/android-release/*.apk
          if-no-files-found: error
          retention-days: 7

      # 每个平台各出一个 SHA256SUMS.<平台>.txt，由 release-checksums.yml
      # 在所有平台跑完后汇总成唯一的 SHA256SUMS.txt。
      #
      # 为什么要拆开而不是各自发一份完整的 SHA256SUMS.txt：7 个 workflow 是
      # 并行跑的，谁先上传谁就赢，后到的会覆盖前者。5.1.1 发版时实际就是这样
      # 翻车的——只有鸿蒙 job 会生成这个文件，于是 Release 里的 SHA256SUMS.txt
      # 只有两个 .hap 的哈希，其余 7 个产物一个都没覆盖到，而它还写着构建机
      # 上的相对路径（build/harmonyos-release/...），用户下载后根本对不上。
      #
      # 生成逻辑抽在 .github/scripts/write_platform_checksums.sh，
      # 因为 7 个 workflow 都要用同一份规则（文件名排序、只写 basename、
      # 排除文本文件），复制 7 遍迟早会漂移。
      - name: Generate per-platform checksums
        shell: bash
        run: bash .github/scripts/write_platform_checksums.sh build/android-release android

      - name: Upload Android assets to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/android-release/*
