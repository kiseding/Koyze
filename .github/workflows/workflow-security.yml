name: Workflow security policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-workflow-security.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-workflow-security.mjs'

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce workflow security policy
        run: node .github/scripts/check-workflow-security.mjs
