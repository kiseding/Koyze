name: Build unsigned IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require source commit on main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main

  build-ios:
    needs: verify-release-source
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Flutter
        # Reviewed upstream major: uses: subosito/flutter-action@v2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run deterministic Flutter tests
        run: flutter test --exclude-tags live

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package and validate Apple ID sideload IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          plutil -lint build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          rm -rf build/ios/ipa-sideload
          mkdir -p build/ios/ipa-sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa-sideload/Payload/Runner.app
          rm -rf build/ios/ipa-sideload/Payload/Runner.app/PlugIns
          test ! -d build/ios/ipa-sideload/Payload/Runner.app/PlugIns
          (
            cd build/ios/ipa-sideload
            ditto -c -k --sequesterRsrc --keepParent Payload ../Koyze-Apple-ID-Sideload.ipa
          )
          unzip -t build/ios/Koyze-Apple-ID-Sideload.ipa
          unzip -Z1 build/ios/Koyze-Apple-ID-Sideload.ipa | grep -qx 'Payload/Runner.app/Info.plist'
          unzip -Z1 build/ios/Koyze-Apple-ID-Sideload.ipa | grep -qx 'Payload/Runner.app/PrivacyInfo.xcprivacy'
          ! unzip -Z1 build/ios/Koyze-Apple-ID-Sideload.ipa | grep -q '/PlugIns/'

      - name: Upload Apple ID sideload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Apple-ID-Sideload-IPA
          path: build/ios/Koyze-Apple-ID-Sideload.ipa
          if-no-files-found: error
          retention-days: 7

  release-ios:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    needs: build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Koyze-Apple-ID-Sideload-IPA
          path: release-assets

      - name: Generate iOS checksum
        working-directory: release-assets
        run: sha256sum -- Koyze-Apple-ID-Sideload.ipa > Koyze-iOS-SHA256SUMS

      - name: Upload iOS IPA to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/Koyze-Apple-ID-Sideload.ipa
            release-assets/Koyze-iOS-SHA256SUMS
          fail_on_unmatched_files: true
