name: Build unsigned IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image label. Intel x64（默认）: macos-15-intel；arm64: macos-15 / macos-26'
        required: false
        type: string
        default: macos-15-intel
      probe:
        description: '编译进帧探针（AppLog 记 build_p95/raster_p95），用于定位卡顿在 UI 侧还是光栅侧。只产 artifact，不发 Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # 原因同 build-macos.yml：arm64 池无容量时改走 x64 池。iOS 设备目标
    # 恒为 arm64，构建主机的架构不影响产出的 IPA。
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ref_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml does not declare a version"
            exit 1
          fi
          IFS=. read -r ref_major ref_minor _ <<< "$ref_version"
          IFS=. read -r pubspec_major pubspec_minor _ <<< "${pubspec_version%%+*}"
          if [ "$ref_major.$ref_minor" != "$pubspec_major.$pubspec_minor" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version; bump pubspec.yaml before tagging"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos

      # 这里只跑构建配置校验，**不跑全量测试**。
      #
      # 全量测试集由 quality.yml 负责：同样的 `--exclude-tags live`，4 分片
      # 在 ubuntu 上 217s 跑完；这一步单片串行在 macOS 上要 751s（固定成本：
      # 每次 flutter test 都要重做约 100s 的测试入口编译，而 macOS runner 光
      # Set up Flutter 就要 258s，开分片反而多付几份 setup）。
      #
      # 而且 macOS 并没有补上 Linux 测不到的覆盖：270 个测试文件里真正按平台
      # 分支的只有 platform_defaults_test，它断言 `useSilenceKeepalive ==
      # (Platform.isIOS || Platform.isMacOS)`——在 Linux 上比 false、在 macOS
      # 上比 true，测的是同一个表达式的两种求值，两边都绿。真实 iOS 行为取决
      # 于设备上的 Platform.isIOS，任何宿主机都测不到。其余 Platform.is 全是
      # 源码字符串断言，与宿主无关。
      #
      # 历史数据也支持这个判断：40 次运行里这段测试一次都没拦下失败（4 次非
      # success 是 2 次并发取消 + 1 次 analyze 失败 + 1 次 upload 失败）。
      # analyze 保留——quality.yml 不响应 tag push，它是 tag 链路上唯一独立的
      # 静态检查，fe87f66 那次就是它拦下的。
      - name: Validate cross-platform build configuration
        run: flutter test test/build_configuration_test.dart

      - name: Install CocoaPods dependencies
        working-directory: ios
        # `pod install` 第一次跑会去 cdn.cocoapods.org 克隆 trunk spec 仓库，
        # 这个 CDN 偶发超时（v6.0.0 那次就是：30s 后 "Unable to add a source
        # with url https://cdn.cocoapods.org/ named trunk" 直接失败，而同一
        # commit 在 main 上是绿的）。Podfile.lock 已入库，重试不会带来版本
        # 漂移，所以这里退避重试三次，而不是让一次 CDN 抖动卡住整个发版。
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pod install; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pod install 连续三次失败，最后一次已放弃重试"
              exit 1
            fi
            echo "::warning::pod install 第 $attempt 次失败，10s 后重试（多为 CocoaPods CDN 抖动）"
            sleep 10
          done

      - name: Build unsigned iOS app
        env:
          # 探针包走和正式包完全相同的编译路径（--release），只多一个编译期
          # 常量，这样量到的帧耗时才代表真实体验。dart-define 用 env 展开：
          # probe 为 false 时它展开成空串，不会留下一个多余的空参数。
          PROBE_DEFINE: ${{ inputs.probe && '--dart-define=KOYZE_PROBE=true' || '' }}
        run: flutter build ios --release --no-codesign $PROBE_DEFINE

      - name: Package and validate Apple ID sideload IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          plutil -lint build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          rm -rf build/ios/ipa-sideload
          mkdir -p build/ios/ipa-sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa-sideload/Payload/Runner.app
          rm -rf build/ios/ipa-sideload/Payload/Runner.app/PlugIns
          test ! -d build/ios/ipa-sideload/Payload/Runner.app/PlugIns
          (
            cd build/ios/ipa-sideload
            ditto -c -k --sequesterRsrc --keepParent Payload ../Koyze-Apple-ID-Sideload.ipa
          )
          unzip -t build/ios/Koyze-Apple-ID-Sideload.ipa
          unzip -Z1 build/ios/Koyze-Apple-ID-Sideload.ipa | grep -qx 'Payload/Runner.app/Info.plist'
          unzip -Z1 build/ios/Koyze-Apple-ID-Sideload.ipa | grep -qx 'Payload/Runner.app/PrivacyInfo.xcprivacy'
          ! unzip -Z1 build/ios/Koyze-Apple-ID-Sideload.ipa | grep -q '/PlugIns/'

      - name: Upload Apple ID sideload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # 探针包加后缀，避免和正式包在 artifact 列表里混在一起。
          name: Koyze-Apple-ID-Sideload-IPA${{ inputs.probe && '-PROBE' || '' }}
          path: build/ios/Koyze-Apple-ID-Sideload.ipa
          if-no-files-found: error
          retention-days: 7

      # 各平台只出自己那份 SHA256SUMS.<平台>.txt，由 release-checksums.yml
      # 汇总成唯一的 SHA256SUMS.txt。原因见该文件与
      # .github/scripts/write_platform_checksums.sh 的说明。
      - name: Generate per-platform checksums
        shell: bash
        run: bash .github/scripts/write_platform_checksums.sh build/ios ios

      # 分片必须和产物一起上传。这里不能只写 .ipa —— 漏掉分片，汇总
      # workflow 会一直等不到 SHA256SUMS.ios.txt，白等 25 分钟才超时失败。
      - name: Upload iOS IPA to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/ios/Koyze-Apple-ID-Sideload.ipa
            build/ios/SHA256SUMS.ios.txt
