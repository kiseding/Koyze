name: Build macOS app

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image label. Intel x64（默认）: macos-15-intel；arm64: macos-15 / macos-26'
        required: false
        type: string
        default: macos-15-intel

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    # 跑在 x64 池：arm64 池（macos-15 / macos-26）在 2026-11 长时间没有容量，
    # 排队 15 分钟就被系统判失败。产物是 universal 包（Release 未开
    # ONLY_ACTIVE_ARCH，ARCHS_STANDARD 含 x86_64 与 arm64），换机队不影响
    # 二进制内容；arm64 池恢复后可把默认值改回 macos-15。
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ref_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml does not declare a version"
            exit 1
          fi
          IFS=. read -r ref_major ref_minor _ <<< "$ref_version"
          IFS=. read -r pubspec_major pubspec_minor _ <<< "${pubspec_version%%+*}"
          if [ "$ref_major.$ref_minor" != "$pubspec_major.$pubspec_minor" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version; bump pubspec.yaml before tagging"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos

      - name: Validate cross-platform build configuration
        run: flutter test test/build_configuration_test.dart

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package unsigned macOS app
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Koyze.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/Koyze"
          test -d "$app/Contents/Frameworks/FlutterMacOS.framework"
          test -d "$app/Contents/Frameworks/App.framework"
          mkdir -p build/macos
          ditto -c -k --keepParent "$app" build/macos/Koyze-macOS.zip
          unzip -t build/macos/Koyze-macOS.zip
          unzip -Z1 build/macos/Koyze-macOS.zip | grep -q 'Koyze.app/Contents/MacOS/Koyze'
          unzip -Z1 build/macos/Koyze-macOS.zip | grep -q 'Koyze.app/Contents/Info.plist'

      - name: Upload macOS app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-macOS
          path: build/macos/Koyze-macOS.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS app to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/macos/Koyze-macOS.zip
