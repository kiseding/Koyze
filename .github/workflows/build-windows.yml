name: Build Windows portable

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos

      - name: Validate cross-platform build configuration
        run: flutter test test/build_configuration_test.dart

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable application
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (!(Test-Path "$release/koyze.exe")) { throw "Windows executable is missing" }
          if (!(Test-Path "$release/flutter_windows.dll")) { throw "Flutter runtime is missing" }
          if (!(Test-Path "$release/data/flutter_assets")) { throw "Flutter assets are missing" }
          if (!(Get-ChildItem $release -Recurse -Filter "quickjs_c_bridge.dll")) { throw "QuickJS runtime is missing" }
          Compress-Archive -Path "$release/*" -DestinationPath "build/windows/Koyze-Windows-x64.zip"

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-Windows-x64
          path: build/windows/Koyze-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows ZIP to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/windows/Koyze-Windows-x64.zip
