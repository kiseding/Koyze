name: Build HarmonyOS HAP

# 此 self-hosted 变体限定 Windows x64；当前 fork 仅为该宿主提供完整的定制 Dart SDK。
# 在线 Windows runner 构建请使用 build-harmonyos-online.yml。
# 准备一台安装以下内容的机器，注册为 self-hosted runner，并打上标签
# `harmonyos`、`Windows`、`X64`：
#   - DevEco Studio（含 HarmonyOS SDK，API 26）
#   - Flutter 鸿蒙 SDK：git clone -b 3.44.9+ohos-0.0.1-canary1 \
#       https://atomgit.com/oh-flutter/flutter_flutter.git
#   - 该 SDK 必须自带完整的 arm64/x64 HAR 与四个 Windows gen_snapshot，
#     且引擎内 Dart VM 版本要与 Dart SDK 一致。工作流会强制校验这一点，
#     不再用 dart-sdk 的通用 gen_snapshot 顶替 ohos 专用生成器——那样会产出
#     能安装但启动即报 "VM snapshot invalid" 的 HAP。
#
# 构建阶段关闭 Flutter 内置 codesign，release 由仓库签名脚本处理。
# 在线 Windows runner 构建请使用 build-harmonyos-online.yml。
#
# 可选仓库变量（Settings → Variables）：
#   FLUTTER_OHOS_HOME   鸿蒙 Flutter SDK 根目录；不填使用 Windows 默认路径
#   HOS_SDK_HOME        DevEco 的 sdk 目录（含 default/sdk-pkg.json）
#   CLT_HOME            DevEco/Command Line Tools 根目录
#
# release 产物同时包含 arm64 真机 HAP 和 x64 模拟器 HAP。
# release 必须配置签名 secrets；上传的 release HAP 均可直接用 hdc 安装。

on:
  # 只在手动触发时跑：这个 job 要 self-hosted runner（标签 harmonyos），
  # 仓库里没有这类 runner。挂在 push 上会永远排队、把 main 的检查卡成黄点，
  # 而真正能在托管 runner 出包的是 build-harmonyos-online.yml。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-harmonyos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-harmonyos:
    runs-on: [self-hosted, harmonyos, Windows, X64]
    timeout-minutes: 60

    env:
      # 用仓库变量覆盖默认值，避免把某台机器的绝对路径写死在仓库里。
      FLUTTER_OHOS_HOME: ${{ vars.FLUTTER_OHOS_HOME }}
      HOS_SDK_HOME: ${{ vars.HOS_SDK_HOME }}
      DEVECO_SDK_HOME: ${{ vars.HOS_SDK_HOME }}
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      # 上游工件走 CN 镜像（直连 storage.googleapis.com 只有 ~20KB/s）。
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
      SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
      SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
      SIGN_PROFILE_B64: ${{ secrets.SIGN_PROFILE_B64 }}
      SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
      SIGN_STORE_PWD: ${{ secrets.SIGN_STORE_PWD }}
      CLT_HOME: ${{ vars.CLT_HOME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ref_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml does not declare a version"
            exit 1
          fi
          IFS=. read -r ref_major ref_minor _ <<< "$ref_version"
          IFS=. read -r pubspec_major pubspec_minor _ <<< "${pubspec_version%%+*}"
          if [ "$ref_major.$ref_minor" != "$pubspec_major.$pubspec_minor" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version; bump pubspec.yaml before tagging"
            exit 1
          fi

      - name: Resolve the HarmonyOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            FLUTTER_OHOS_HOME="${FLUTTER_OHOS_HOME:-D:/flutter_ohos_parent/flutter_ohos}"
            HOS_SDK_HOME="${HOS_SDK_HOME:-D:/DevEco Studio/sdk}"
            CLT_HOME="${CLT_HOME:-D:/DevEco Studio}"
          else
            if [ -z "${FLUTTER_OHOS_HOME:-}" ]; then
              echo "::error::非 Windows self-hosted runner 必须设置仓库变量 FLUTTER_OHOS_HOME"
              exit 1
            fi
            if [ -z "${HOS_SDK_HOME:-}" ]; then
              echo "::error::非 Windows self-hosted runner 必须设置仓库变量 HOS_SDK_HOME"
              exit 1
            fi
            if [ -z "${CLT_HOME:-}" ]; then
              echo "::error::非 Windows self-hosted runner 必须设置仓库变量 CLT_HOME"
              exit 1
            fi
          fi
          export FLUTTER_OHOS_HOME HOS_SDK_HOME CLT_HOME
          DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export DEVECO_SDK_HOME

          if [ ! -d "$FLUTTER_OHOS_HOME" ]; then
            echo "::error::找不到鸿蒙 Flutter SDK：$FLUTTER_OHOS_HOME"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter="$FLUTTER_OHOS_HOME/bin/flutter.bat"
          else
            flutter="$FLUTTER_OHOS_HOME/bin/flutter"
          fi
          if [ ! -f "$flutter" ]; then
            echo "::error::$FLUTTER_OHOS_HOME 下没有 flutter 可执行文件"
            exit 1
          fi

          printf 'FLUTTER_OHOS_HOME=%s\nHOS_SDK_HOME=%s\nDEVECO_SDK_HOME=%s\nCLT_HOME=%s\n' \
            "$FLUTTER_OHOS_HOME" "$HOS_SDK_HOME" "$DEVECO_SDK_HOME" "$CLT_HOME" >> "$GITHUB_ENV"

          # 工具链扫 HOS_SDK_HOME 的子目录读 sdk-pkg.json 认版本，指向
          # sdk/default 会报 "No Hmos SDK found"。
          sdk_pkg="$HOS_SDK_HOME/default/sdk-pkg.json"
          if [ ! -f "$sdk_pkg" ]; then
            echo "::error::$HOS_SDK_HOME 下没有 default/sdk-pkg.json；HOS_SDK_HOME 应指向 DevEco 的 sdk 目录"
            exit 1
          fi
          api="$(grep -o '"apiVersion"[^,]*' "$sdk_pkg" | head -1 | grep -o '[0-9]\+')"
          echo "HarmonyOS SDK API: ${api:-unknown}"
          if [ -n "${api:-}" ] && [ "$api" -lt 26 ]; then
            echo "::warning::SDK API $api 低于本项目要求的 26（HarmonyOS 7.0）"
          fi

          echo "FLUTTER_BIN=$flutter" >> "$GITHUB_ENV"
          "$flutter" --version

      - name: Verify HarmonyOS engine artifacts
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          if [ "$RUNNER_OS" != Windows ] || [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::self-hosted HarmonyOS runner 必须是 Windows x64，当前为 $RUNNER_OS/$RUNNER_ARCH"
            exit 1
          fi
          host_dir=windows-x64
          host_file=gen_snapshot.exe
          for arch in arm64 x64; do
            for mode in '' -profile -release; do
              test -f "$engine/ohos-$arch$mode/flutter.har" || {
                echo "::error::缺少 ohos-$arch$mode/flutter.har"
                exit 1
              }
            done
            for mode in profile release; do
              test -f "$engine/ohos-$arch-$mode/$host_dir/$host_file" || {
                echo "::error::缺少 ohos-$arch-$mode/$host_dir/$host_file"
                exit 1
              }
            done
          done

      # 引擎里的 Dart VM 必须与 AOT 生成器同版本，否则 HAP 装得上、一启动就
      # 报 "VM snapshot invalid" 并 SIGSEGV。这里只校验、不替换。
      - name: Validate HarmonyOS engine / AOT snapshotter consistency
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          dart_bin="$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/dart.exe"

          dart_version="$("$dart_bin" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
          test -n "$dart_version" || {
            echo "::error::无法从 Dart SDK 读取版本"
            exit 1
          }
          har_rev="$(tr -d '\r\n' < "$FLUTTER_OHOS_HOME/bin/internal/engine.ohos.har.version")"
          echo "Dart SDK version: $dart_version"
          echo "engine.ohos.har revision: $har_rev"

          for arch in arm64 x64; do
            case "$arch" in
              arm64) expected_host=windows_simarm64 ;;
              x64)   expected_host=windows_x64 ;;
            esac
            for mode in profile release; do
              snap="$engine/ohos-$arch-$mode/windows-x64/gen_snapshot.exe"
              test -f "$snap" || {
                echo "::error::缺少 ohos-$arch-$mode/windows-x64/gen_snapshot.exe"
                exit 1
              }
              version="$("$snap" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
              host="$("$snap" --version 2>&1 | tr -d '\r' | sed -n 's/.* on "\([^"]*\)"/\1/p')"
              echo "ohos-$arch-$mode gen_snapshot: Dart $version on $host"
              if [ "$version" != "$dart_version" ] || [ "$host" != "$expected_host" ]; then
                echo "::error::ohos-$arch-$mode gen_snapshot 应为 Dart $dart_version on $expected_host，实际 $version on $host"
                exit 1
              fi
            done
          done

          python - "$engine" "$dart_version" <<'PY'
          import gzip
          import io
          import re
          import sys
          import tarfile
          from pathlib import Path

          engine = Path(sys.argv[1])
          want = sys.argv[2]
          pattern = re.compile(rb'(\d+\.\d+\.\d+) \([^)]*\) \([^)]*\) on "(ohos[^"]*)"')
          problems = []
          for arch, abi in (('arm64', 'arm64-v8a'), ('x64', 'x86_64')):
              for mode in ('', '-profile', '-release'):
                  har = engine / f'ohos-{arch}{mode}' / 'flutter.har'
                  with gzip.open(har, 'rb') as handle:
                      raw = handle.read()
                  with tarfile.open(fileobj=io.BytesIO(raw)) as tar:
                      name = next(
                          (n for n in tar.getnames() if n.endswith(f'libs/{abi}/libflutter.so')),
                          None,
                      )
                      if name is None:
                          problems.append(f'ohos-{arch}{mode}: HAR 内没有 libs/{abi}/libflutter.so')
                          continue
                      data = tar.extractfile(name).read()
                  versions = sorted({m.group(1).decode() for m in pattern.finditer(data)})
                  print(f'ohos-{arch}{mode} libflutter.so: Dart {versions or "unknown"}')
                  if versions != [want]:
                      problems.append(
                          f'ohos-{arch}{mode}: 引擎 VM 为 {versions or "unknown"}，AOT 生成器为 {want}'
                      )
          if problems:
              raise SystemExit('::error::引擎与 AOT 生成器不一致：' + '; '.join(problems))
          PY

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          # 音频移植的 override 只在鸿蒙工具链上能编译（移植代码引用了
          # TargetPlatform.ohos），所以放在 pubspec_ohos.yaml 里，构建前换入。
          cp pubspec_ohos.yaml pubspec.yaml
          # TPC 移植仓库带 git-lfs 大文件，机器上没装 git-lfs 时 checkout 会失败。
          # 这里只跳过 smudge（我们只要 Dart / ArkTS 源码），不改全局 git 配置。
          cfg="$RUNNER_TEMP/gitconfig_nolfs"
          printf '[filter "lfs"]\n\tprocess =\n\tsmudge =\n\tclean =\n\trequired = false\n' > "$cfg"
          export GIT_CONFIG_GLOBAL="$cfg"
          "$FLUTTER_BIN" pub get

      - name: Analyze Dart and Flutter sources
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig_nolfs"
          "$FLUTTER_BIN" analyze --no-fatal-infos

      - name: Require HarmonyOS release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_B64 SIGN_CERT_B64 SIGN_PROFILE_B64 SIGN_KEY_PWD; do
            test -n "${!name:-}" || {
              echo "::error::缺少 HarmonyOS release 签名 secret: $name"
              exit 1
            }
          done

      - name: Build HarmonyOS arm64 and x64 HAPs
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          out="build/harmonyos-release"
          rm -rf "$out"
          mkdir -p "$out"
          for arch in arm64 x64; do
            rm -rf build/ohos ohos/entry/build ohos/entry/libs ohos/har
            set +e
            "$FLUTTER_BIN" build hap --release --no-codesign \
              --target-platform "ohos-$arch" --no-tree-shake-icons
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::ohos-$arch 构建失败（exit $rc）"
              exit "$rc"
            fi
            mapfile -t haps < <(find ohos/entry/build -name '*-unsigned.hap' -type f)
            if [ "${#haps[@]}" -ne 1 ]; then
              echo "::error::ohos-$arch 应产出恰好一个 unsigned HAP，实际得到 ${#haps[@]} 个"
              printf '%s\n' "${haps[@]}"
              exit 1
            fi
            cp "${haps[0]}" "$out/Koyze-${version}-ohos-$arch-unsigned.hap"
          done

      - name: Sign HarmonyOS HAPs
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          trap 'rm -rf "$S"' EXIT
          decode_b64() {
            if [ "$RUNNER_OS" = "macOS" ]; then
              base64 -D
            else
              base64 -d
            fi
          }
          printf '%s' "$SIGN_KEYSTORE_B64" | decode_b64 > "$S/koyze.p12"
          printf '%s' "$SIGN_CERT_B64"     | decode_b64 > "$S/koyze-release.cer"
          printf '%s' "$SIGN_PROFILE_B64"  | decode_b64 > "$S/Koyze-release.p7b"
          export SIGN_DIR="$S"
          export KEY_PWD="$SIGN_KEY_PWD"
          export STORE_PWD="${SIGN_STORE_PWD:-$SIGN_KEY_PWD}"
          for hap in build/harmonyos-release/*-unsigned.hap; do
            signed="${hap%-unsigned.hap}.hap"
            bash scripts/ohos/sign-hap.sh "$hap" "$signed"
            rm -f "$hap"
          done

      - name: Verify HAPs and checksums
        shell: bash
        run: |
          set -euo pipefail
          out=build/harmonyos-release
          count="$(find "$out" -maxdepth 1 -name '*.hap' -type f | wc -l)"
          test "$count" -eq 2
          if find "$out" -name '*-unsigned.hap' -type f -print -quit | grep -q .; then
            echo "::error::release 产物仍包含 unsigned HAP"
            exit 1
          fi
          dart_version="$("$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/dart.exe" --version 2>&1 \
            | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
          test -n "$dart_version" || { echo "::error::无法从 Dart SDK 读取版本"; exit 1; }
          python - "$out" "$dart_version" <<'PY'
          import re
          import struct
          import sys
          import zipfile
          from pathlib import Path

          out = Path(sys.argv[1])
          dart_version = sys.argv[2]
          version_pattern = re.compile(rb'(\d+\.\d+\.\d+) \([^)]*\) \([^)]*\) on "ohos[^"]*"')
          expected = {
              'ohos-arm64': {
                  'flutter': ('libs/arm64-v8a/libflutter.so', 183),
                  'app': ('libs/arm64-v8a/libapp.so', 183),
                  'quickjs': ('libs/arm64-v8a/libquickjs_c_bridge.so', 183),
                  'cxx': ('libs/arm64-v8a/libc++_shared.so', 183),
              },
              'ohos-x64': {
                  'flutter': ('libs/x86_64/libflutter.so', 62),
                  'app': ('libs/x86_64/libapp.so', 62),
                  'quickjs': ('libs/x86_64/libquickjs_c_bridge.so', 62),
                  'cxx': ('libs/x86_64/libc++_shared.so', 62),
              },
          }
          for hap in sorted(out.glob('*.hap')):
              target = next((key for key in expected if key in hap.name), None)
              if target is None:
                  raise SystemExit(f'Unexpected HAP name: {hap.name}')
              with zipfile.ZipFile(hap) as archive:
                  names = set(archive.namelist())
                  flutter_member = expected[target]['flutter'][0]
                  if flutter_member not in names:
                      raise SystemExit(f'{hap.name} is missing {flutter_member}')
                  versions = sorted({
                      m.group(1).decode()
                      for m in version_pattern.finditer(archive.read(flutter_member))
                  })
                  if versions != [dart_version]:
                      raise SystemExit(
                          f'{hap.name} 的 libflutter.so Dart VM 为 {versions or "unknown"}，'
                          f'与 AOT 生成器 {dart_version} 不一致；该 HAP 安装后会报 '
                          f'"VM snapshot invalid"'
                      )
                  for label, (member, machine) in expected[target].items():
                      if member not in names:
                          raise SystemExit(f'{hap.name} is missing {member}')
                      data = archive.read(member)
                      if data[:4] != b'\x7fELF' or len(data) < 20:
                          raise SystemExit(f'{hap.name} has a non-ELF {member}')
                      actual = struct.unpack_from('<H', data, 18)[0]
                      if actual != machine:
                          raise SystemExit(
                              f'{hap.name} {label} ELF machine {actual}, expected {machine}'
                          )
          PY
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out"/*.hap > "$out/SHA256SUMS.txt"
          else
            shasum -a 256 "$out"/*.hap > "$out/SHA256SUMS.txt"
          fi
          ls -lh "$out"/*

      - name: Upload HarmonyOS HAPs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koyze-HarmonyOS-HAPs
          path: build/harmonyos-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload HAPs to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/harmonyos-release/*
