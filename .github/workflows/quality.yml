name: Quality gate

# 现有的平台构建 workflow 只在 push 到 main 或打 tag 时触发，
# 意味着 PR 在合并前没有任何自动检查——review 只能靠人眼。
# 这个 workflow 补上合并前的门禁：分析 + 分片测试 + Workers 校验。
#
# 为什么测试要留在 CI（本机 `flutter test` 明明也能跑）：
#   - 本机是 Flutter 3.47.5，CI 锁的是 3.44.9。5.0.5 发版时就踩过：同一份代码
#     在本机能跑、用仓库锁文件在新 SDK 上构建出来的包却启动即崩。本机绿灯证明
#     不了**要发出去的那套工具链**是绿的。
#   - 直接 push 到 main 是常态（没有 PR），本机忘了跑 / 只跑了单文件的情况拦不住。
#   - 但 2309 条全塞进一个 job 要 233 秒（2 核 runner），所以拆两件事：
#     analyze 单独一个 job 先出结果，测试按分片并行。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Verify every workflow pins the same Flutter patch
        shell: bash
        run: |
          set -euo pipefail
          # 各平台 workflow 必须锁同一个 Flutter 版本，否则某个平台会悄悄
          # 用另一套 SDK 构建，产出行为不一致的二进制。
          versions="$(grep -rhoP "flutter-version:\s*'\K[0-9.]+" .github/workflows/*.yml | sort -u)"
          count="$(printf '%s\n' "$versions" | wc -l)"
          echo "pinned versions:"
          printf '%s\n' "$versions"
          if [ "$count" -ne 1 ]; then
            echo "::error::工作流锁定了多个 Flutter 版本，必须统一"
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Flutter test (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 实测（2309 条、公开仓库 4 vCPU runner）：
    #   单片跑全量 = 233s；切 4 片后每片 147~168s，workflow 墙钟 285s → 202s。
    # 剩下的时间不是"跑测试"，而是每次 `flutter test` 都要重做的编译
    # （测试入口 + 框架 kernel，约 100s）——这是**每次调用**的固定成本，
    # 再往上加片只会让每片都空等这段编译，所以停在 4 片。
    strategy:
      fail-fast: false
      matrix:
        total: [4]
        # --shard-index 从 0 开始，这里用 0..3 直接透传。
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        # `flutter test` 默认会自己再 pub get 一次，上一步已经做过，跳过。
        run: >-
          flutter test
          --no-pub
          --exclude-tags live
          --total-shards ${{ matrix.total }}
          --shard-index ${{ matrix.shard }}

  workers:
    name: Workers typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate (test + typecheck + structure)
        run: npm run validate

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 逻辑在 .github/scripts/check_md_links.sh 里，本步只负责调用。
      # 抽出去的原因：这段规则（相对所在目录、跳过 third_party、剥掉代码块）
      # 光靠"改完等 CI 跑 5 分钟"验证太慢，抽出来之后本地一条命令就能跑，
      # 也才能被 test/docs/markdown_links_test.dart 拿去做回归。
      - name: Verify referenced docs exist
        shell: bash
        run: bash .github/scripts/check_md_links.sh
