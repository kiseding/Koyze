name: Quality gate

# 现有的平台构建 workflow 只在 push 到 main 或打 tag 时触发，
# 意味着 PR 在合并前没有任何自动检查——review 只能靠人眼。
# 这个 workflow 补上合并前的门禁：分析 + 分片测试 + Workers 校验。
#
# 为什么测试要留在 CI（本机 `flutter test` 明明也能跑）：
#   - 本机是 Flutter 3.47.5，CI 锁的是 3.44.9。5.0.5 发版时就踩过：同一份代码
#     在本机能跑、用仓库锁文件在新 SDK 上构建出来的包却启动即崩。本机绿灯证明
#     不了**要发出去的那套工具链**是绿的。
#   - 直接 push 到 main 是常态（没有 PR），本机忘了跑 / 只跑了单文件的情况拦不住。
#   - 但 2309 条全塞进一个 job 要 233 秒（2 核 runner），所以拆两件事：
#     analyze 单独一个 job 先出结果，测试按分片并行。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Verify every workflow pins the same Flutter patch
        shell: bash
        run: |
          set -euo pipefail
          # 各平台 workflow 必须锁同一个 Flutter 版本，否则某个平台会悄悄
          # 用另一套 SDK 构建，产出行为不一致的二进制。
          versions="$(grep -rhoP "flutter-version:\s*'\K[0-9.]+" .github/workflows/*.yml | sort -u)"
          count="$(printf '%s\n' "$versions" | wc -l)"
          echo "pinned versions:"
          printf '%s\n' "$versions"
          if [ "$count" -ne 1 ]; then
            echo "::error::工作流锁定了多个 Flutter 版本，必须统一"
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Flutter test (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 分片是按测试文件轮转切的，单核 runner 上整包要 233 秒；四片并行后每片
    # 只剩一分钟量级，整条 workflow 的墙钟时间从 ~5 分钟降到 ~2 分钟。
    # 公开仓库的 runner 不额外计费，加片数不花钱。
    strategy:
      fail-fast: false
      matrix:
        total: [4]
        # --shard-index 从 0 开始，这里用 0..3 直接透传。
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: >-
          flutter test
          --exclude-tags live
          --total-shards ${{ matrix.total }}
          --shard-index ${{ matrix.shard }}

  workers:
    name: Workers typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate (test + typecheck + structure)
        run: npm run validate

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify referenced docs exist
        shell: bash
        run: |
          set -euo pipefail
          # CONTRIBUTING 曾经指向一个不存在的 CODE_OF_CONDUCT.md，
          # 这类死链对贡献者很不友好。这里拦住所有本地 Markdown 相对链接。
          #
          # 两个必须注意的点：
          # 1. 链接是相对于**所在文件**的目录，不是仓库根目录——
          #    docs/adr/0001 里的 ../../workers/... 从根目录看就是错的。
          # 2. third_party/ 是 vendored 上游代码，它的 README 引用自己的
          #    截图，和本仓库无关，不该拦。
          fail=0
          while IFS= read -r file; do
            case "$file" in
              third_party/*) continue ;;
            esac
            dir="$(dirname "$file")"
            # 提取 markdown 链接里的相对路径（跳过 http/https/mailto/锚点）
            while IFS= read -r target; do
              case "$target" in
                http*|https*|mailto:*|\#*|'') continue ;;
              esac
              # 去掉锚点与查询串
              clean="${target%%#*}"
              clean="${clean%%\?*}"
              [ -z "$clean" ] && continue
              # 绝对路径是站内链接，与仓库文件无关
              case "$clean" in
                /*) continue ;;
              esac
              if [ ! -e "$dir/$clean" ]; then
                echo "::error file=$file::引用的文件不存在: $target"
                fail=1
              fi
            done < <(grep -oP '\]\(\K[^)]+' "$file" 2>/dev/null || true)
          done < <(git ls-files '*.md')
          exit "$fail"
