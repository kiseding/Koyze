name: Build HarmonyOS HAP (hosted runner)

# 在线构建，不装 DevEco Studio、不用 self-hosted runner。
#
# 构建策略：
#   - 鸿蒙 Flutter fork 必须整套自洽：Dart SDK、flutter_patched_sdk、各档
#     flutter.har、以及 Windows 宿主的 gen_snapshot 必须来自同一个
#     engine.ohos.har revision。混用不同 revision 会产出「能安装但一启动就崩」
#     的 HAP。
#   - 因此这里锁定 tag `3.44.9+ohos-0.0.1-canary1`（Dart 3.12.2 /
#     har revision 7c82f544）。该 revision 的 OBS 目录同时提供 arm64 与 x64
#     的 artifacts.zip、windows-x64.zip 和 dart-sdk，是当前公开可用的唯一
#     完整套装。
#   - 不要改成 fork 的分支名：oh-3.44.9-dev 分支 HEAD 已把引擎换成
#     4741be57，那个 revision 只剩 artifacts.zip，没有配套 AOT 生成器。
#   - 千万不要用 dart-sdk 自带的通用 gen_snapshot 顶替 ohos 专用生成器：
#     3.47.7 分支就是这么做才导致 libflutter.so 里的 Dart VM 是 3.12.2、
#     而 AOT 快照是 3.13.3，设备上直接报
#     "VM snapshot invalid and could not be inferred from settings"。
#   - 华为 Command Line Tools 由仓库 Release 中的分卷提供，workflow 用 GITHUB_TOKEN
#     下载并解压；这不等于绕过华为工具链许可，使用者需自行确认授权范围。
#   - fork 只给 Windows 宿主提供完整的定制 Dart/AOT 工件，所以 runner 固定为
#     windows-latest。
#
# Release 构建同时产出 arm64 真机 HAP 和 x64 模拟器 HAP。配置签名 secrets
# 后，Artifact/Release 中只保留 signed HAP，下载后可直接用 hdc 安装。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        type: choice
        options: [debug, release]
        default: release
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ohos/**'
      - 'pubspec*.yaml'
      - 'assets/icon/**'
      - 'third_party/**'
      - 'scripts/ohos/**'
      - '.github/workflows/build-harmonyos-online.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ohos-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # 短路径：Flutter 仓库层级很深，配合 workspace 的长路径会撞 260 字符上限
      FLUTTER_OHOS_HOME: C:/fo/flutter_ohos
      # CLT 放 D 盘：分卷 2.6GB + 解压 7.8GB，C 盘只剩 ~14GB 不够；workspace 也在 D:
      HOS_SDK_HOME: D:/fo/command-line-tools/sdk
      DEVECO_SDK_HOME: D:/fo/command-line-tools/sdk
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
      # 必须和 workspace 同盘！flutter-hvigor-plugin 用 path.relative 算插件
      # srcPath，Windows 上跨盘符会返回绝对路径，hvigor 直接报
      # "The srcPath is not a relative path"。workspace 在 D:，缓存也放 D:。
      PUB_CACHE: D:/pc
      TOOLCHAIN_TAG: toolchain-ohos-3.47.7
      # 必须用 tag 而不是分支：引擎工件只在这个 commit 上是完整的。
      FLUTTER_OHOS_REF: 3.44.9+ohos-0.0.1-canary1
      HAP_BUILD_MODE: ${{ inputs.mode || 'release' }}

    steps:
      - uses: actions/checkout@v4

      # 工具链放哪都行，凭据从仓库配置来：
      #   同仓库 Release（默认）：什么都不用配，但公开仓库的 Release 附件也是公开的，
      #     CLT 会被公开再分发，注意华为许可。
      #   独立私有仓库：设 var TOOLCHAIN_REPO + secret TOOLCHAIN_TOKEN
      #     （fine-grained PAT，只给那个仓库 Contents: Read）。
      - name: 取 Command Line Tools（分卷）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOOLCHAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tc_repo="${{ vars.TOOLCHAIN_REPO || github.repository }}"
          mkdir -p /d/fo/dl
          # CLT zip 2.6GB，超过 Release 单文件 2GB 上限，所以按 1.2GB 分卷存
          gh release download "$TOOLCHAIN_TAG" --repo "$tc_repo" \
            --pattern 'command-line-tools-windows.zip.part*' --dir /d/fo/dl --clobber
          cd /d/fo/dl
          ls -lh
          cat command-line-tools-windows.zip.part* > clt.zip
          rm -f command-line-tools-windows.zip.part*
          7z x -y clt.zip -o/d/fo > /dev/null
          rm -f clt.zip
          sdk_pkg="$HOS_SDK_HOME/default/sdk-pkg.json"
          if [ ! -f "$sdk_pkg" ]; then
            echo "::error::CLT 里没有 sdk/default/sdk-pkg.json，检查压缩包顶层目录名是否为 command-line-tools/"
            ls -la /d/fo; exit 1
          fi
          api="$(grep -o '"apiVersion"[^,]*' "$sdk_pkg" | head -1 | grep -o '[0-9]\+')"
          echo "HarmonyOS SDK API: ${api:-unknown}"
          if [ -n "${api:-}" ] && [ "$api" -lt 26 ]; then
            echo "::warning::SDK API $api 低于项目要求的 26"
          fi
          # CLT 自带 node / ohpm / hvigor，优先用自带的
          for d in tool/node node bin hvigor/bin ohpm/bin; do
            [ -d "/d/fo/command-line-tools/$d" ] && echo "D:/fo/command-line-tools/$d" >> "$GITHUB_PATH"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 拉鸿蒙 Flutter fork
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$FLUTTER_OHOS_REF" \
            https://atomgit.com/oh-flutter/flutter_flutter.git "$FLUTTER_OHOS_HOME"
          resolved="$(git -C "$FLUTTER_OHOS_HOME" rev-parse HEAD)"
          echo "flutter_ohos $FLUTTER_OHOS_REF -> $resolved"
          echo "FLUTTER_OHOS_COMMIT=$resolved" >> "$GITHUB_ENV"

      - name: 初始化工具链（自动拉 dart-sdk 与引擎工件）
        shell: bash
        run: |
          set -euo pipefail
          # 不做任何 URL 重写：3.44.9 的 flutter_tools 会用 fork 内的
          # engine.ohos.har.version 拼出 OBS 地址，一次性拉齐 dart-sdk、
          # patched_sdk、六套 HAR 和四个 Windows gen_snapshot。
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" --version
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" precache --ohos
          ls "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"

      - name: 换入鸿蒙依赖清单并解析依赖
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec_ohos.yaml pubspec.yaml
          # TPC 移植仓库带 git-lfs 大文件，跳过 smudge
          printf '[filter "lfs"]\n\tprocess =\n\tsmudge =\n\tclean =\n\trequired = false\n' \
            > "$RUNNER_TEMP/gitconfig_nolfs"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig_nolfs" >> "$GITHUB_ENV"
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" pub get

      # 这是唯一能拦住「HAP 能装、一启动就崩」的门禁：引擎里的 Dart VM 必须与
      # AOT 生成器同版本。3.47.7 分支曾用 dart-sdk 自带的通用 gen_snapshot 顶替
      # ohos 专用生成器，于是 HAP 里 libflutter.so 是 Dart 3.12.2、libapp.so 是
      # 3.13.3 生成的，设备上直接报 "VM snapshot invalid and could not be
      # inferred from settings" 并 SIGSEGV。
      - name: 校验引擎与 AOT 生成器自洽
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          dart_bin="$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/dart.exe"
          dart_version="$("$dart_bin" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
          test -n "$dart_version" || { echo "::error::无法从 Dart SDK 读取版本"; exit 1; }
          har_rev="$(tr -d '\r\n' < "$FLUTTER_OHOS_HOME/bin/internal/engine.ohos.har.version")"
          echo "Dart SDK version: $dart_version"
          echo "engine.ohos.har revision: $har_rev"

          for arch in arm64 x64; do
            for mode in '' -profile -release; do
              test -f "$engine/ohos-$arch$mode/flutter.har" || {
                echo "::error::缺少 ohos-$arch$mode/flutter.har"
                exit 1
              }
            done
            if [ "$HAP_BUILD_MODE" = release ]; then
              case "$arch" in
                arm64) expected_host=windows_simarm64 ;;
                x64)   expected_host=windows_x64 ;;
                *)     echo "::error::未知架构 $arch"; exit 1 ;;
              esac
              for mode in profile release; do
                snap="$engine/ohos-$arch-$mode/windows-x64/gen_snapshot.exe"
                test -f "$snap" || {
                  echo "::error::缺少 ohos-$arch-$mode/windows-x64/gen_snapshot.exe"
                  exit 1
                }
                v="$("$snap" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
                h="$("$snap" --version 2>&1 | tr -d '\r' | sed -n 's/.* on "\([^"]*\)".*/\1/p')"
                echo "ohos-$arch-$mode gen_snapshot: Dart $v on $h"
                if [ "$v" != "$dart_version" ] || [ "$h" != "$expected_host" ]; then
                  echo "::error::ohos-$arch-$mode gen_snapshot 应为 Dart $dart_version on $expected_host，实际 $v on $h"
                  exit 1
                fi
              done
            fi
          done

          python - "$engine" "$dart_version" <<'PY'
          import gzip
          import io
          import re
          import sys
          import tarfile
          from pathlib import Path

          engine = Path(sys.argv[1])
          want = sys.argv[2]
          pattern = re.compile(rb'(\d+\.\d+\.\d+) \([^)]*\) \([^)]*\) on "(ohos[^"]*)"')
          problems = []
          for arch, abi in (('arm64', 'arm64-v8a'), ('x64', 'x86_64')):
              for mode in ('', '-profile', '-release'):
                  har = engine / f'ohos-{arch}{mode}' / 'flutter.har'
                  with gzip.open(har, 'rb') as handle:
                      raw = handle.read()
                  with tarfile.open(fileobj=io.BytesIO(raw)) as tar:
                      name = next(
                          (n for n in tar.getnames() if n.endswith(f'libs/{abi}/libflutter.so')),
                          None,
                      )
                      if name is None:
                          problems.append(f'ohos-{arch}{mode}: HAR 内没有 libs/{abi}/libflutter.so')
                          continue
                      data = tar.extractfile(name).read()
                  versions = sorted({m.group(1).decode() for m in pattern.finditer(data)})
                  print(f'ohos-{arch}{mode} libflutter.so: Dart {versions or "unknown"}')
                  if versions != [want]:
                      problems.append(
                          f'ohos-{arch}{mode}: 引擎 VM 为 {versions or "unknown"}，AOT 生成器为 {want}'
                      )
          if problems:
              raise SystemExit('::error::引擎与 AOT 生成器不一致：' + '; '.join(problems))
          PY

      - name: 要求 HarmonyOS release 签名材料
        if: env.HAP_BUILD_MODE == 'release'
        shell: bash
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
          SIGN_PROFILE_B64: ${{ secrets.SIGN_PROFILE_B64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_B64 SIGN_CERT_B64 SIGN_PROFILE_B64 SIGN_KEY_PWD; do
            test -n "${!name:-}" || {
              echo "::error::缺少 HarmonyOS release 签名 secret: $name"
              exit 1
            }
          done

      - name: 构建 arm64 与 x64 HAP
        shell: bash
        run: |
          set -euo pipefail
          mode="$HAP_BUILD_MODE"
          # CI 在 Flutter 阶段统一关闭 codesign，后续 release 由仓库签名脚本
          # 使用受控 secrets 签名；避免 DevEco 默认 signingConfig 缺失导致构建失败。
          extra="--no-codesign"
          # release 在 Windows 上还要绕开图标 tree-shaker：patched_sdk 与 dart-sdk
          # 的 SDK hash 不匹配，否则报 "Invalid SDK hash"
          [ "$mode" = "release" ] && extra="$extra --no-tree-shake-icons"
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          test -n "$version"
          out="build/harmonyos-$mode"
          rm -rf "$out"
          mkdir -p "$out"

          for arch in arm64 x64; do
            # Flutter/Hvigor 复用 build 目录，清理后再切换架构，避免 HAP 混入上一架构。
            rm -rf build/ohos ohos/entry/build ohos/entry/libs ohos/har
            set +e
            "$FLUTTER_OHOS_HOME/bin/flutter.bat" build hap \
              "--$mode" $extra --target-platform "ohos-$arch"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::ohos-$arch 构建失败（exit $rc）"
              exit "$rc"
            fi
            mapfile -t haps < <(find ohos/entry/build -name '*-unsigned.hap' -type f)
            if [ "${#haps[@]}" -ne 1 ]; then
              echo "::error::ohos-$arch 应产出恰好一个 unsigned HAP，实际得到 ${#haps[@]} 个"
              printf '%s\n' "${haps[@]}"
              exit 1
            fi
            dst="$out/Koyze-${version}-ohos-$arch-unsigned.hap"
            cp "${haps[0]}" "$dst"
            echo "ohos-$arch HAP："
            ls -lh "$dst"
          done

      # 发布 profile 必须是可在目标设备安装的 release profile，而不是单设备调试 profile。
      # 签名材料只在 runner 临时目录中解码，签完立即清理。
      - name: 签名 HarmonyOS release HAP
        if: env.HAP_BUILD_MODE == 'release'
        shell: bash
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
          SIGN_PROFILE_B64: ${{ secrets.SIGN_PROFILE_B64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_STORE_PWD: ${{ secrets.SIGN_STORE_PWD }}
          CLT_HOME: D:/fo/command-line-tools
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          trap 'rm -rf "$S"' EXIT
          printf '%s' "$SIGN_KEYSTORE_B64" | base64 -d > "$S/koyze.p12"
          printf '%s' "$SIGN_CERT_B64"     | base64 -d > "$S/koyze-release.cer"
          printf '%s' "$SIGN_PROFILE_B64"  | base64 -d > "$S/Koyze-release.p7b"
          export SIGN_DIR="$S"
          export KEY_PWD="$SIGN_KEY_PWD"
          export STORE_PWD="${SIGN_STORE_PWD:-$SIGN_KEY_PWD}"
          for hap in build/harmonyos-release/*-unsigned.hap; do
            signed="${hap%-unsigned.hap}.hap"
            bash scripts/ohos/sign-hap.sh "$hap" "$signed"
            rm -f "$hap"
          done

      - name: 校验可下载 HAP
        shell: bash
        run: |
          set -euo pipefail
          out="build/harmonyos-$HAP_BUILD_MODE"
          count="$(find "$out" -maxdepth 1 -name '*.hap' -type f | wc -l)"
          test "$count" -eq 2 || {
            echo "::error::期望 arm64/x64 两个 HAP，实际得到 $count"
            exit 1
          }
          if [ "$HAP_BUILD_MODE" = release ] && find "$out" -name '*-unsigned.hap' -type f -print -quit | grep -q .; then
            echo "::error::release 产物仍包含 unsigned HAP"
            exit 1
          fi
          dart_version="$("$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/dart.exe" --version 2>&1 \
            | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
          test -n "$dart_version" || { echo "::error::无法从 Dart SDK 读取版本"; exit 1; }
          python - "$out" "$HAP_BUILD_MODE" "$dart_version" <<'PY'
          import re
          import struct
          import sys
          import zipfile
          from pathlib import Path

          out = Path(sys.argv[1])
          mode = sys.argv[2]
          dart_version = sys.argv[3]
          version_pattern = re.compile(rb'(\d+\.\d+\.\d+) \([^)]*\) \([^)]*\) on "ohos[^"]*"')
          expected = {
              'ohos-arm64': {
                  'flutter': ('libs/arm64-v8a/libflutter.so', 183),
                  'app': ('libs/arm64-v8a/libapp.so', 183),
                  'quickjs': ('libs/arm64-v8a/libquickjs_c_bridge.so', 183),
                  'cxx': ('libs/arm64-v8a/libc++_shared.so', 183),
              },
              'ohos-x64': {
                  'flutter': ('libs/x86_64/libflutter.so', 62),
                  'app': ('libs/x86_64/libapp.so', 62),
                  'quickjs': ('libs/x86_64/libquickjs_c_bridge.so', 62),
                  'cxx': ('libs/x86_64/libc++_shared.so', 62),
              },
          }
          for hap in sorted(out.glob('*.hap')):
              target = next((key for key in expected if key in hap.name), None)
              if target is None:
                  raise SystemExit(f'Unexpected HAP name: {hap.name}')
              with zipfile.ZipFile(hap) as archive:
                  names = set(archive.namelist())
                  flutter_member = expected[target]['flutter'][0]
                  if flutter_member not in names:
                      raise SystemExit(f'{hap.name} is missing {flutter_member}')
                  versions = sorted({
                      m.group(1).decode()
                      for m in version_pattern.finditer(archive.read(flutter_member))
                  })
                  if versions != [dart_version]:
                      raise SystemExit(
                          f'{hap.name} 的 libflutter.so Dart VM 为 {versions or "unknown"}，'
                          f'与 AOT 生成器 {dart_version} 不一致；该 HAP 安装后会报 '
                          f'"VM snapshot invalid"'
                      )
                  if mode != 'release':
                      continue
                  for label, (member, machine) in expected[target].items():
                      if member not in names:
                          raise SystemExit(f'{hap.name} is missing {member}')
                      data = archive.read(member)
                      if data[:4] != b'\x7fELF' or len(data) < 20:
                          raise SystemExit(f'{hap.name} has a non-ELF {member}')
                      actual = struct.unpack_from('<H', data, 18)[0]
                      if actual != machine:
                          raise SystemExit(
                              f'{hap.name} {label} ELF machine {actual}, expected {machine}'
                          )
          PY
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out"/*.hap > "$out/SHA256SUMS.txt"
          else
            shasum -a 256 "$out"/*.hap > "$out/SHA256SUMS.txt"
          fi
          ls -lh "$out"/*

      - uses: actions/upload-artifact@v4
        with:
          name: Koyze-HarmonyOS-HAPs
          path: build/harmonyos-${{ env.HAP_BUILD_MODE }}/*
          if-no-files-found: error
          retention-days: 7

      - name: 上传 HAP 到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/harmonyos-${{ env.HAP_BUILD_MODE }}/*
