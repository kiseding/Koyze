name: Build HarmonyOS HAP (hosted runner)

# 在线构建，不装 DevEco Studio、不用 self-hosted runner。
#
# 构建策略：
#   - Flutter fork 的定制 Dart/patch SDK 按 fork 自带的 dart-sdk-url.ohos 下载。
#   - arm64/x64 的六套 flutter.har 从当前 engine.ohos.har.version 对应的
#     HarmonyOS OBS 下载；当前 3.47.7 fork 的 OBS Windows AOT 仍是 Dart 3.12.2，
#     不可与本工作流的 Dart 3.13.3 混用。
#   - arm64 的 Windows AOT 从已验证的 3.47.4-ohos-1.0.4 兼容 Release 下载，
#     x64 的 profile/release AOT 统一使用同一 Dart SDK 自带的 Windows x64 生成器。
#   - 华为 Command Line Tools 由仓库 Release 中的分卷提供，workflow 用 GITHUB_TOKEN
#     下载并解压；这不等于绕过华为工具链许可，使用者需自行确认授权范围。
#   - fork 只给 Windows 宿主提供完整的定制 Dart/AOT 工件，所以 runner 固定为
#     windows-latest。
#
# Release 构建同时产出 arm64 真机 HAP 和 x64 模拟器 HAP。配置签名 secrets
# 后，Artifact/Release 中只保留 signed HAP，下载后可直接用 hdc 安装。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        type: choice
        options: [debug, release]
        default: release
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ohos/**'
      - 'pubspec*.yaml'
      - 'assets/icon/**'
      - 'third_party/**'
      - 'scripts/ohos/**'
      - '.github/workflows/build-harmonyos-online.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ohos-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # 短路径：Flutter 仓库层级很深，配合 workspace 的长路径会撞 260 字符上限
      FLUTTER_OHOS_HOME: C:/fo/flutter_ohos
      # CLT 放 D 盘：分卷 2.6GB + 解压 7.8GB，C 盘只剩 ~14GB 不够；workspace 也在 D:
      HOS_SDK_HOME: D:/fo/command-line-tools/sdk
      DEVECO_SDK_HOME: D:/fo/command-line-tools/sdk
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
      # 必须和 workspace 同盘！flutter-hvigor-plugin 用 path.relative 算插件
      # srcPath，Windows 上跨盘符会返回绝对路径，hvigor 直接报
      # "The srcPath is not a relative path"。workspace 在 D:，缓存也放 D:。
      PUB_CACHE: D:/pc
      TOOLCHAIN_TAG: toolchain-ohos-3.47.7
      # 3.47.7 Release 没有 Windows AOT 附件；该 3.47.4 兼容批次仍使用
      # Dart 3.13.3，并已在本机成功生成 ARM64 release HAP。
      AOT_COMPAT_RELEASE_TAG: 3.47.4-ohos-1.0.4
      HAP_BUILD_MODE: ${{ inputs.mode || 'release' }}

    steps:
      - uses: actions/checkout@v4

      # 工具链放哪都行，凭据从仓库配置来：
      #   同仓库 Release（默认）：什么都不用配，但公开仓库的 Release 附件也是公开的，
      #     CLT 会被公开再分发，注意华为许可。
      #   独立私有仓库：设 var TOOLCHAIN_REPO + secret TOOLCHAIN_TOKEN
      #     （fine-grained PAT，只给那个仓库 Contents: Read）。
      - name: 取 Command Line Tools（分卷）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOOLCHAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tc_repo="${{ vars.TOOLCHAIN_REPO || github.repository }}"
          mkdir -p /d/fo/dl
          # CLT zip 2.6GB，超过 Release 单文件 2GB 上限，所以按 1.2GB 分卷存
          gh release download "$TOOLCHAIN_TAG" --repo "$tc_repo" \
            --pattern 'command-line-tools-windows.zip.part*' --dir /d/fo/dl --clobber
          cd /d/fo/dl
          ls -lh
          cat command-line-tools-windows.zip.part* > clt.zip
          rm -f command-line-tools-windows.zip.part*
          7z x -y clt.zip -o/d/fo > /dev/null
          rm -f clt.zip
          sdk_pkg="$HOS_SDK_HOME/default/sdk-pkg.json"
          if [ ! -f "$sdk_pkg" ]; then
            echo "::error::CLT 里没有 sdk/default/sdk-pkg.json，检查压缩包顶层目录名是否为 command-line-tools/"
            ls -la /d/fo; exit 1
          fi
          api="$(grep -o '"apiVersion"[^,]*' "$sdk_pkg" | head -1 | grep -o '[0-9]\+')"
          echo "HarmonyOS SDK API: ${api:-unknown}"
          if [ -n "${api:-}" ] && [ "$api" -lt 26 ]; then
            echo "::warning::SDK API $api 低于项目要求的 26"
          fi
          # CLT 自带 node / ohpm / hvigor，优先用自带的
          for d in tool/node node bin hvigor/bin ohpm/bin; do
            [ -d "/d/fo/command-line-tools/$d" ] && echo "D:/fo/command-line-tools/$d" >> "$GITHUB_PATH"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 拉鸿蒙 Flutter fork
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 -b 3.47.7-ohos-1.0.0 \
            https://atomgit.com/oh-flutter/flutter_flutter.git "$FLUTTER_OHOS_HOME"

      - name: 初始化工具链（自动拉 dart-sdk 与引擎工件）
        shell: bash
        run: |
          set -euo pipefail

          # 定制 Dart/patch SDK 继续走 fork Release；HAR 必须使用
          # engine.ohos.har.version 对应的 OBS 工件，避免把不同 engine revision
          # 的 Flutter 引擎混在一次构建里。Windows AOT 在下一步单独覆盖：当前
          # engine.ohos.version 的 OBS 快照仍是 Dart 3.12.2，与本 fork 的 3.13.3
          # kernel 不兼容。
          config="$FLUTTER_OHOS_HOME/bin/internal/dart-sdk-url.ohos"
          test -f "$config"
          har_version="$(tr -d '\r\n' < "$FLUTTER_OHOS_HOME/bin/internal/engine.ohos.har.version")"
          test -n "$har_version"
          python - "$config" "$har_version" <<'PY'
          import pathlib
          import sys

          config = pathlib.Path(sys.argv[1])
          har_base = (
              'https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com/'
              f'flutter_infra_release/flutter/{sys.argv[2]}'
          )
          replacements = {}
          for arch in ('arm64', 'x64'):
              for mode in ('', '-profile', '-release'):
                  key = f'ohos-{arch}{mode}/artifacts.zip'
                  replacements[key] = f'{har_base}/{key}'
          lines = []
          found = set()
          for line in config.read_text(encoding='utf-8').splitlines():
              key = line.split(':', 1)[0] if ':' in line else ''
              if key in replacements:
                  line = f'{key}:{replacements[key]}'
                  found.add(key)
              lines.append(line)
          # 3.47.7 的仓库配置只预置了 arm64 键；x64 HAR 键必须追加，不能
          # 让它们回退到默认地址，否则会重新混入旧的 kernel 工件。
          for key in sorted(set(replacements) - found):
              lines.append(f'{key}:{replacements[key]}')
          config.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          "$FLUTTER_OHOS_HOME/bin/flutter.bat" --version
          # 修改覆盖地址后清理 OHOS 引擎缓存，让 precache 按 OBS 地址下载完整的
          # arm64/x64 六套 HAR 和 Windows AOT，不沿用预装的旧缓存。
          rm -rf "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine/ohos-arm64" \
                 "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine/ohos-arm64-profile" \
                 "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine/ohos-arm64-release" \
                 "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine/ohos-x64" \
                 "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine/ohos-x64-profile" \
                 "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine/ohos-x64-release"
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" precache --ohos
          ls "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"

      - name: 补齐配套 Windows AOT 工件（仅 release）
        if: env.HAP_BUILD_MODE == 'release'
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          base="https://atomgit.com/oh-flutter/flutter_flutter/releases/download/$AOT_COMPAT_RELEASE_TAG"
          for pair in \
            'ohos-arm64-profile-windows-x64.zip:ohos-arm64-profile' \
            'ohos-arm64-release-windows-x64.zip:ohos-arm64-release'; do
            zip="${pair%%:*}"
            dir="${pair##*:}"
            target="$engine/$dir/windows-x64"
            mkdir -p "$target"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "$base/$zip" -o "$RUNNER_TEMP/$zip"
            7z x -y "$RUNNER_TEMP/$zip" -o"$target" > /dev/null
            test -s "$target/gen_snapshot.exe" || {
              echo "::error::兼容 Release 缺少 $dir/gen_snapshot.exe"
              exit 1
            }
          done
          # x64 工件路径由引擎缓存仍会要求存在，但 OBS 版本是 Dart 3.12.2。
          # 先用同一 Dart SDK 自带的 Windows x64 生成器占位，下一步还会再次校验。
          sdk_snapshot="$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/utils/gen_snapshot.exe"
          test -s "$sdk_snapshot"
          for dir in ohos-x64-profile ohos-x64-release; do
            mkdir -p "$engine/$dir/windows-x64"
            cp "$sdk_snapshot" "$engine/$dir/windows-x64/gen_snapshot.exe"
          done

      - name: 换入鸿蒙依赖清单并解析依赖
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec_ohos.yaml pubspec.yaml
          # TPC 移植仓库带 git-lfs 大文件，跳过 smudge
          printf '[filter "lfs"]\n\tprocess =\n\tsmudge =\n\tclean =\n\trequired = false\n' \
            > "$RUNNER_TEMP/gitconfig_nolfs"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig_nolfs" >> "$GITHUB_ENV"
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" pub get

      # precache --ohos 会下载 arm64 与 x64 的 debug/profile/release 引擎工件。
      # 这里显式校验两种架构，避免缺少 x64 gen_snapshot 时静默回退到旧 kernel。
      - name: 校验 HarmonyOS 双架构引擎工件
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          for arch in arm64 x64; do
            for mode in '' -profile -release; do
              test -f "$engine/ohos-$arch$mode/flutter.har" || {
                echo "::error::缺少 ohos-$arch$mode/flutter.har"
                exit 1
              }
            done
          done
          if [ "$HAP_BUILD_MODE" = release ]; then
            for arch in arm64 x64; do
              for mode in profile release; do
                test -f "$engine/ohos-$arch-$mode/windows-x64/gen_snapshot.exe" || {
                  echo "::error::缺少 ohos-$arch-$mode Windows gen_snapshot"
                  exit 1
                }
              done
            done
          fi

      - name: 校验并修正 HarmonyOS AOT 快照生成器
        if: env.HAP_BUILD_MODE == 'release'
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          dart_bin="$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/dart.exe"
          sdk_snapshot="$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/utils/gen_snapshot.exe"
          test -f "$dart_bin"
          test -f "$sdk_snapshot"

          dart_version="$("$dart_bin" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
          test -n "$dart_version" || {
            echo "::error::无法从 Dart SDK 读取版本"
            exit 1
          }
          echo "Dart SDK version: $dart_version"

          snapshot_version() {
            "$1" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p'
          }

          snapshot_host() {
            "$1" --version 2>&1 | tr -d '\r' | sed -n 's/.* on "\([^"]*\)"/\1/p'
          }

          check_snapshot() {
            local snapshot="$1"
            local expected_host="$2"
            local version
            local host
            version="$(snapshot_version "$snapshot")"
            host="$(snapshot_host "$snapshot")"
            echo "$(basename "$(dirname "$snapshot")")/$(basename "$snapshot"): Dart $version on $host"
            [ "$version" = "$dart_version" ] && [ "$host" = "$expected_host" ]
          }

          arm64_snapshot="$engine/ohos-arm64-release/windows-x64/gen_snapshot.exe"
          if ! check_snapshot "$arm64_snapshot" windows_simarm64; then
            echo "::error::ohos-arm64-release gen_snapshot 与 Dart $dart_version 或 ARM64 目标不匹配"
            exit 1
          fi

          # 当前公开 OBS 的 x64 Windows AOT 是旧 Dart 3.12.2；无论缓存是否
          # 存在，都用同一 Dart SDK 自带的 Windows x64 生成器，保持 kernel 与
          # AOT 快照格式一致。
          for mode in profile release; do
            x64_dir="$engine/ohos-x64-$mode/windows-x64"
            x64_snapshot="$x64_dir/gen_snapshot.exe"
            mkdir -p "$x64_dir"
            cp "$sdk_snapshot" "$x64_snapshot"
            check_snapshot "$x64_snapshot" windows_x64 || {
              echo "::error::Dart SDK 自带 x64 gen_snapshot 与 Dart $dart_version 不匹配"
              exit 1
            }
          done

      - name: 要求 HarmonyOS release 签名材料
        if: env.HAP_BUILD_MODE == 'release'
        shell: bash
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
          SIGN_PROFILE_B64: ${{ secrets.SIGN_PROFILE_B64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_B64 SIGN_CERT_B64 SIGN_PROFILE_B64 SIGN_KEY_PWD; do
            test -n "${!name:-}" || {
              echo "::error::缺少 HarmonyOS release 签名 secret: $name"
              exit 1
            }
          done

      - name: 构建 arm64 与 x64 HAP
        shell: bash
        run: |
          set -euo pipefail
          mode="$HAP_BUILD_MODE"
          # CI 在 Flutter 阶段统一关闭 codesign，后续 release 由仓库签名脚本
          # 使用受控 secrets 签名；避免 DevEco 默认 signingConfig 缺失导致构建失败。
          extra="--no-codesign"
          # release 在 Windows 上还要绕开图标 tree-shaker：patched_sdk 与 dart-sdk
          # 的 SDK hash 不匹配，否则报 "Invalid SDK hash"
          [ "$mode" = "release" ] && extra="$extra --no-tree-shake-icons"
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          test -n "$version"
          out="build/harmonyos-$mode"
          rm -rf "$out"
          mkdir -p "$out"

          for arch in arm64 x64; do
            # Flutter/Hvigor 复用 build 目录，清理后再切换架构，避免 HAP 混入上一架构。
            rm -rf build/ohos ohos/entry/build ohos/entry/libs ohos/har
            set +e
            "$FLUTTER_OHOS_HOME/bin/flutter.bat" build hap \
              "--$mode" $extra --target-platform "ohos-$arch"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::ohos-$arch 构建失败（exit $rc）"
              exit "$rc"
            fi
            mapfile -t haps < <(find ohos/entry/build -name '*-unsigned.hap' -type f)
            if [ "${#haps[@]}" -ne 1 ]; then
              echo "::error::ohos-$arch 应产出恰好一个 unsigned HAP，实际得到 ${#haps[@]} 个"
              printf '%s\n' "${haps[@]}"
              exit 1
            fi
            dst="$out/Koyze-${version}-ohos-$arch-unsigned.hap"
            cp "${haps[0]}" "$dst"
            echo "ohos-$arch HAP："
            ls -lh "$dst"
          done

      # 发布 profile 必须是可在目标设备安装的 release profile，而不是单设备调试 profile。
      # 签名材料只在 runner 临时目录中解码，签完立即清理。
      - name: 签名 HarmonyOS release HAP
        if: env.HAP_BUILD_MODE == 'release'
        shell: bash
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
          SIGN_PROFILE_B64: ${{ secrets.SIGN_PROFILE_B64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_STORE_PWD: ${{ secrets.SIGN_STORE_PWD }}
          CLT_HOME: D:/fo/command-line-tools
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          trap 'rm -rf "$S"' EXIT
          printf '%s' "$SIGN_KEYSTORE_B64" | base64 -d > "$S/koyze.p12"
          printf '%s' "$SIGN_CERT_B64"     | base64 -d > "$S/koyze-release.cer"
          printf '%s' "$SIGN_PROFILE_B64"  | base64 -d > "$S/Koyze-release.p7b"
          export SIGN_DIR="$S"
          export KEY_PWD="$SIGN_KEY_PWD"
          export STORE_PWD="${SIGN_STORE_PWD:-$SIGN_KEY_PWD}"
          for hap in build/harmonyos-release/*-unsigned.hap; do
            signed="${hap%-unsigned.hap}.hap"
            bash scripts/ohos/sign-hap.sh "$hap" "$signed"
            rm -f "$hap"
          done

      - name: 校验可下载 HAP
        shell: bash
        run: |
          set -euo pipefail
          out="build/harmonyos-$HAP_BUILD_MODE"
          count="$(find "$out" -maxdepth 1 -name '*.hap' -type f | wc -l)"
          test "$count" -eq 2 || {
            echo "::error::期望 arm64/x64 两个 HAP，实际得到 $count"
            exit 1
          }
          if [ "$HAP_BUILD_MODE" = release ] && find "$out" -name '*-unsigned.hap' -type f -print -quit | grep -q .; then
            echo "::error::release 产物仍包含 unsigned HAP"
            exit 1
          fi
          python - "$out" "$HAP_BUILD_MODE" <<'PY'
          import struct
          import sys
          import zipfile
          from pathlib import Path

          if sys.argv[2] == 'release':
              out = Path(sys.argv[1])
              expected = {
                  'ohos-arm64': ('libs/arm64-v8a/libapp.so', 183),
                  'ohos-x64': ('libs/x86_64/libapp.so', 62),
              }
              for hap in sorted(out.glob('*.hap')):
                  target = next((key for key in expected if key in hap.name), None)
                  if target is None:
                      raise SystemExit(f'Unexpected HAP name: {hap.name}')
                  member, machine = expected[target]
                  with zipfile.ZipFile(hap) as archive:
                      if member not in archive.namelist():
                          raise SystemExit(f'{hap.name} is missing {member}')
                      data = archive.read(member)
                  if data[:4] != b'\x7fELF' or len(data) < 20:
                      raise SystemExit(f'{hap.name} has a non-ELF {member}')
                  actual = struct.unpack_from('<H', data, 18)[0]
                  if actual != machine:
                      raise SystemExit(f'{hap.name} has ELF machine {actual}, expected {machine}')
          PY
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out"/*.hap > "$out/SHA256SUMS.txt"
          else
            shasum -a 256 "$out"/*.hap > "$out/SHA256SUMS.txt"
          fi
          ls -lh "$out"/*

      - uses: actions/upload-artifact@v4
        with:
          name: Koyze-HarmonyOS-HAPs
          path: build/harmonyos-${{ env.HAP_BUILD_MODE }}/*
          if-no-files-found: error
          retention-days: 7

      - name: 上传 HAP 到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/harmonyos-${{ env.HAP_BUILD_MODE }}/*
