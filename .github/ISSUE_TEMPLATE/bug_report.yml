name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认你已经读过 README 的「常见问题」章节。

        **重要**：本仓库不附带任何音源脚本，也不讨论如何获取音源。此类内容会被直接关闭。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题
          required: true
        - label: 我已阅读 README 的「常见问题」章节
          required: true
        - label: 这个问题不是「没有音源所以播不了」导致的
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - Windows
        - iOS
        - macOS
        - Linux
        - HarmonyOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Koyze 版本
      description: 见「设置 → 关于」，格式如 v4.1.0
      placeholder: v4.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: Android 14 / Windows 11 23H2 / HarmonyOS 7.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写得足够具体，让别人能照着复现
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 诊断日志
      description: |
        设置 → 高级 → 应用日志 → 导出。日志已做脱敏，但仍请自行检查一遍再粘贴。
      render: text

  - type: input
    id: source
    attributes:
      label: 使用的自定义音源
      description: 只填名称与版本，**不要粘贴脚本内容**
      placeholder: 例如「巡回寺 1.3.0」或「未启用」

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、录屏链接或其他可能相关的上下文
