name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议
          required: true
        - label: 我理解本仓库不接收任何音源脚本、音频地址解析或绕过付费墙的实现
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景而不是直接给方案，这样更容易找到更好的解法
      placeholder: 我在 ... 的时候，总是需要 ...，很麻烦
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 播放与歌词
        - 搜索与音源
        - 本地曲库与下载
        - NAS / 自建媒体库
        - 歌单与统计
        - 云同步
        - 界面与交互
        - 平台适配
        - 其他
    validations:
      required: true
