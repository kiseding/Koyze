name: koyze
description: Koyze - 一个免费的音乐查找助手
publish_to: 'none'
version: 4.2.0+420

homepage: https://github.com/kiseding/koyze
repository: https://github.com/kiseding/koyze
issue_tracker: https://github.com/kiseding/koyze/issues

# Apache-2.0 仅覆盖本项目新增与修改的部分。
# 上游 LX-Music-Flutter-Mobile 未声明许可证，其原始代码版权归原作者，
# 详见仓库根目录的 NOTICE 文件。
license: Apache-2.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.6.1
  
  # 路由
  go_router: ^14.8.1
  
  # 音频播放
  just_audio: ^0.9.42
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  rxdart: ^0.28.0
  
  # 网络
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  # WebDAV PROPFIND 响应解析
  xml: ^6.5.0
  
  # 存储
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  shared_preferences_platform_interface: ^2.4.2
  flutter_secure_storage: ^9.2.4
  
  # JS 引擎
  flutter_js: ^0.8.2
  
  # 工具
  crypto: ^3.0.3
  uuid: ^4.4.0
  file_picker: ^11.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  charset: ^2.0.1

  # iOS home widget and live activity
  home_widget: ^0.6.0
  flutter_app_group_directory: ^1.1.0
  live_activities:
    path: third_party/live_activities
  audio_metadata_reader: ^1.7.1
  permission_handler: ^12.0.3
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# 鸿蒙构建使用独立的 pubspec_ohos.yaml（本文件的一份拷贝 + dependency_overrides）。
# 移植包的 Dart 代码引用了 TargetPlatform.ohos，只在鸿蒙 Flutter fork 里存在，
# 把 override 写在这里会让上游 Flutter（其余五个平台的 CI）编译失败。

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  # Required by `flutter gen-l10n`; without it the generated AppLocalizations
  # class is not wired into the build. It was previously placed under
  # flutter_launcher_icons, where it had no effect.
  generate: true
  config:
    # Nested WorkBuddy/CodeBuddy sandboxes cannot resolve Swift packages
    # (`sandbox-exec: sandbox_apply: Operation not permitted`). Force the
    # existing CocoaPods path on iOS/macOS instead.
    enable-swift-package-manager: false
