# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored OpenHarmony ports keep upstream code/lints untouched; they are
    # only consumed through pubspec_ohos.yaml and would otherwise flood
    # `flutter analyze` with third-party warnings.
    - third_party/file_picker/**
    - third_party/flutter_secure_storage/**
    - third_party/shared_preferences/**
    - third_party/shared_preferences_ohos/**
    - third_party/path_provider/**
    - third_party/path_provider_ohos/**
    - third_party/connectivity_plus/**
    - third_party/connectivity_plus_platform_interface/**
    - third_party/flutter_js/**
    - third_party/just_audio/**
    # Web 补丁源码是**片段**，不是能独立编译的库：它们在 `scripts/build-web.sh`
    # 的临时副本里覆盖 `lib/` 下的同名文件后才成立，相对导入（如
    # `../logging/app_log.dart`）和 `package:koyze/...` 在仓库根目录下解析不到。
    # 让分析器扫它们只会得到一堆假 error，CI 的 `flutter analyze` 会直接失败。
    - scripts/web-patch/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    unawaited_futures: true
    avoid_print: true
    require_trailing_commas: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
