# HarmonyOS 专用依赖清单（本地改造版）：在原有音频移植基础上，
# 补齐 shared_preferences / path_provider / connectivity_plus 的鸿蒙实现，
# 并将 flutter_secure_storage、file_picker 替换为社区 ohos 移植包，
# flutter_js 使用仓库内 QuickJS FFI 移植（同时提供 arm64 与 x86_64 原生库）。
name: koyze
description: Koyze - 一个免费的音乐查找助手
publish_to: 'none'
version: 4.1.0+410

homepage: https://github.com/kiseding/koyze
repository: https://github.com/kiseding/koyze
issue_tracker: https://github.com/kiseding/koyze/issues

license: Apache-2.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 音频播放
  just_audio: ^0.9.42
  # 鸿蒙原生播放器（固定 vendored 源码，便于修复 AVPlayer 缓冲与时序问题）
  just_audio_ohos:
    path: third_party/just_audio/ohos
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  rxdart: ^0.28.0

  # 网络
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  # WebDAV PROPFIND 响应解析
  xml: ^6.5.0

  # 存储
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  shared_preferences_platform_interface: ^2.4.2
  # flutter_secure_storage 鸿蒙移植见 dependency_overrides（官方名指向 vendor）
  flutter_secure_storage: ^9.2.4

  # JS 引擎（实现位于 dependency_overrides 的仓库内 OHOS QuickJS 移植）
  flutter_js: ^0.8.2

  # 工具
  crypto: ^3.0.3
  uuid: ^4.4.0
  # file_picker 鸿蒙移植见 dependency_overrides（官方名指向 vendor）
  file_picker: ^11.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  charset: ^2.0.1

  # iOS home widget and live activity
  home_widget: ^0.6.0
  flutter_app_group_directory: ^1.1.0
  live_activities:
    path: third_party/live_activities
  audio_metadata_reader: ^1.7.1
  permission_handler: ^12.0.3
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # just_audio_ohos 声明 rxdart >=0.26.0 <0.28.0，与 app 的 ^0.28.0 冲突；
  # 它的 Dart 代码只用于接口定义，实际走原生插件，放宽版本不影响运行。
  rxdart: ^0.28.0
  # 使用仓库内固定版本，便于修复并验证 HarmonyOS AVPlayer 行为。
  just_audio:
    path: third_party/just_audio
  audio_service:
    path: third_party/audio_service_ohos
  audio_session:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_audio_session.git
      ref: br_v0.1.21_ohos

  # ===== 官方插件鸿蒙移植（vendor 到 third_party，保持官方包名）=====
  flutter_secure_storage:
    path: third_party/flutter_secure_storage
  file_picker:
    path: third_party/file_picker
  shared_preferences:
    path: third_party/shared_preferences
  shared_preferences_ohos:
    path: third_party/shared_preferences_ohos
  path_provider:
    path: third_party/path_provider
  path_provider_ohos:
    path: third_party/path_provider_ohos
  connectivity_plus:
    path: third_party/connectivity_plus
  connectivity_plus_platform_interface:
    path: third_party/connectivity_plus_platform_interface

  # flutter_js：QuickJS FFI 的鸿蒙移植（vendor，保持官方包名）
  flutter_js:
    path: third_party/flutter_js

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
